name: CI (Lint & Typecheck)

on:
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install & build shared
        run: npm --prefix packages/shared ci && npm --prefix packages/shared run build

      - name: Typecheck, lint & test website
        run: |
          npm --prefix website ci
          npm --prefix website exec tsc -- --project website/tsconfig.json --noEmit
          npm --prefix website run lint
          npm --prefix website test

      - name: Typecheck & test core
        run: |
          npm --prefix services/core ci
          npm --prefix packages/shared exec tsc -- --project services/core/tsconfig.json --noEmit
          npm --prefix services/core test

      - name: Typecheck collab
        run: |
          npm --prefix services/collab ci
          npm --prefix packages/shared exec tsc -- --project services/collab/tsconfig.json --noEmit

      - name: Typecheck compile
        run: |
          npm --prefix services/compile ci
          npm --prefix packages/shared exec tsc -- --project services/compile/tsconfig.json --noEmit
